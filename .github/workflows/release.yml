name: Release

# A pushed tag v* becomes a GitHub Release whose notes are that version's
# section of CHANGELOG.md. A tag with a hyphen (v1.0.0-rc.1) is a prerelease.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false
      - name: the tag is the version the changelog and api.txt describe
        run: |
          go run ./internal/tools/apilist -check
          go run ./internal/tools/doccheck
      - name: notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '
            /^## \[/ { if (on) exit; on = index($0, "[" v "]") > 0; next }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $v" >&2
            exit 1
          fi
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md $flags
